name: lambda-qa-deployment-with-github-action

on:
  push:
    branches:
      - feature/github_actions

jobs:
  lambda-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to repo
        uses: actions/checkout@v4

      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install node
        run: npm install

      - name: Install lambda globally
        run: npm install -g node-lambda

      - name: Check if Github Secrets exist
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "Secret AWS_ACCESS_KEY_ID is not set"
            exit 1  # Fail the workflow if the secret is not set
          elif [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Secret AWS_SECRET_ACCESS_KEY is not set"
            exit 1  # Fail the workflow if the secret is not set
          else
            echo "AWS secrets exist"
          fi

      - name: Deploy lambda function
        env:
          AWS_ACCESS_KEY_ID_QA: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_QA: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: npm run deploy-item-qa
